<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDF6F0"/>
      <stop offset="100%" stop-color="#F5E6DA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E08B68"/>
      <stop offset="100%" stop-color="#D77757"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D77757"/>
      <stop offset="100%" stop-color="#B8583A"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- Outer radiating rays (starburst, 12 rays) -->
  <g transform="translate(512,512)" opacity="0.12">
    <g fill="#D77757">
      <polygon points="0,-420 18,-180 -18,-180" transform="rotate(0)"/>
      <polygon points="0,-420 18,-180 -18,-180" transform="rotate(30)"/>
      <polygon points="0,-420 18,-180 -18,-180" transform="rotate(60)"/>
      <polygon points="0,-420 18,-180 -18,-180" transform="rotate(90)"/>
      <polygon points="0,-420 18,-180 -18,-180" transform="rotate(120)"/>
      <polygon points="0,-420 18,-180 -18,-180" transform="rotate(150)"/>
      <polygon points="0,-420 18,-180 -18,-180" transform="rotate(180)"/>
      <polygon points="0,-420 18,-180 -18,-180" transform="rotate(210)"/>
      <polygon points="0,-420 18,-180 -18,-180" transform="rotate(240)"/>
      <polygon points="0,-420 18,-180 -18,-180" transform="rotate(270)"/>
      <polygon points="0,-420 18,-180 -18,-180" transform="rotate(300)"/>
      <polygon points="0,-420 18,-180 -18,-180" transform="rotate(330)"/>
    </g>
  </g>

  <!-- Outer gear ring -->
  <g transform="translate(512,512)">
    <circle cx="0" cy="0" r="320" fill="none" stroke="url(#accent)" stroke-width="28" opacity="0.25"/>
    <!-- Gear teeth (8 teeth) -->
    <g fill="url(#accent)" opacity="0.3">
      <rect x="-20" y="-355" width="40" height="50" rx="6" transform="rotate(0)"/>
      <rect x="-20" y="-355" width="40" height="50" rx="6" transform="rotate(45)"/>
      <rect x="-20" y="-355" width="40" height="50" rx="6" transform="rotate(90)"/>
      <rect x="-20" y="-355" width="40" height="50" rx="6" transform="rotate(135)"/>
      <rect x="-20" y="-355" width="40" height="50" rx="6" transform="rotate(180)"/>
      <rect x="-20" y="-355" width="40" height="50" rx="6" transform="rotate(225)"/>
      <rect x="-20" y="-355" width="40" height="50" rx="6" transform="rotate(270)"/>
      <rect x="-20" y="-355" width="40" height="50" rx="6" transform="rotate(315)"/>
    </g>
  </g>

  <!-- Inner rotating element - mystery/mechanism motif -->
  <g transform="translate(512,512)">
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="200" fill="none" stroke="url(#deep)" stroke-width="8" opacity="0.35"/>

    <!-- Central starburst / XuanJi pattern - 6 pointed radial -->
    <g fill="url(#deep)">
      <!-- Main diamond/rhombus shapes radiating from center -->
      <polygon points="0,-180 35,-60 0,-20 -35,-60" opacity="0.9" transform="rotate(0)"/>
      <polygon points="0,-180 35,-60 0,-20 -35,-60" opacity="0.9" transform="rotate(60)"/>
      <polygon points="0,-180 35,-60 0,-20 -35,-60" opacity="0.9" transform="rotate(120)"/>
      <polygon points="0,-180 35,-60 0,-20 -35,-60" opacity="0.9" transform="rotate(180)"/>
      <polygon points="0,-180 35,-60 0,-20 -35,-60" opacity="0.9" transform="rotate(240)"/>
      <polygon points="0,-180 35,-60 0,-20 -35,-60" opacity="0.9" transform="rotate(300)"/>

      <!-- Secondary smaller petals between main ones -->
      <polygon points="0,-130 18,-55 0,-30 -18,-55" opacity="0.5" transform="rotate(30)"/>
      <polygon points="0,-130 18,-55 0,-30 -18,-55" opacity="0.5" transform="rotate(90)"/>
      <polygon points="0,-130 18,-55 0,-30 -18,-55" opacity="0.5" transform="rotate(150)"/>
      <polygon points="0,-130 18,-55 0,-30 -18,-55" opacity="0.5" transform="rotate(210)"/>
      <polygon points="0,-130 18,-55 0,-30 -18,-55" opacity="0.5" transform="rotate(270)"/>
      <polygon points="0,-130 18,-55 0,-30 -18,-55" opacity="0.5" transform="rotate(330)"/>
    </g>

    <!-- Center dot -->
    <circle cx="0" cy="0" r="22" fill="url(#deep)"/>
    <circle cx="0" cy="0" r="10" fill="#FDF6F0"/>
  </g>

  <!-- Small orbital dots on the outer ring -->
  <g transform="translate(512,512)" fill="#D77757" opacity="0.5">
    <circle cx="320" cy="0" r="10" transform="rotate(22.5)"/>
    <circle cx="320" cy="0" r="10" transform="rotate(67.5)"/>
    <circle cx="320" cy="0" r="10" transform="rotate(112.5)"/>
    <circle cx="320" cy="0" r="10" transform="rotate(157.5)"/>
    <circle cx="320" cy="0" r="10" transform="rotate(202.5)"/>
    <circle cx="320" cy="0" r="10" transform="rotate(247.5)"/>
    <circle cx="320" cy="0" r="10" transform="rotate(292.5)"/>
    <circle cx="320" cy="0" r="10" transform="rotate(337.5)"/>
  </g>
</svg>
